name: Publish Python 🐍 distributions 📦 to PyPI

# Triggered by pushing a version tag such as `1.1.0` or `v1.1.0`.
# Publishes to PyPI (with PEP 740 provenance) and records GitHub SLSA build
# provenance attestations — without storing workflow artifacts or creating
# GitHub Releases.
#
# PyPI Trusted Publisher configuration (https://pypi.org/manage/project/hued/settings/publishing/):
#   PyPI Project Name : hued
#   Owner             : Infinitode
#   Repository name   : Hued
#   Workflow name     : build_and_publish.yml
#   Environment name  : (leave blank)
on:
  push:
    tags:
      - "[0-9]*.*"
      - "v[0-9]*.*"

# Strict least privilege at the workflow root; elevated permissions are granted
# only on the publish job.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the tagged commit is on main
        env:
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if ! git rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
          fi
          if git rev-parse --verify -q refs/remotes/origin/main >/dev/null; then
            if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
              echo "::error::Tag $TAG_NAME ($TAG_SHA) is not on main. Merge into main before tagging."
              exit 1
            fi
          fi
          echo "Tag $TAG_NAME is verified on main."

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify tag matches pyproject.toml and hued.__version__
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          import hued

          raw_tag = os.environ["TAG_NAME"]
          tag_version = raw_tag[1:] if raw_tag.startswith("v") else raw_tag
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.post[0-9]+|\.dev[0-9]+)?", tag_version):
              sys.exit(f"Tag {raw_tag!r} is not a valid PEP 440 release version.")

          with open("pyproject.toml", "rb") as fh:
              project_version = tomllib.load(fh)["project"]["version"]

          if tag_version != project_version or tag_version != hued.__version__:
              sys.exit(
                  f"Version mismatch: tag={tag_version!r}, "
                  f"pyproject.toml={project_version!r}, "
                  f"hued.__version__={hued.__version__!r}"
              )
          print(f"Verified release version: {tag_version} (from tag {raw_tag})")
          PY

      - name: Lint and run test suite
        run: |
          ruff check .
          python -m pytest -q

  publish:
    name: Build, publish to PyPI, and attest provenance
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: `environment` is intentionally omitted to match the blank environment
    # configured in Hued's PyPI Trusted Publisher settings.
    permissions:
      contents: read
      id-token: write # Required for PyPI OIDC Trusted Publishing, PEP 740, & attestation signing
      attestations: write # Required for GitHub SLSA build provenance attestations
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build and verify sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Smoke-test built wheel in clean virtualenv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install --no-index --find-links=dist hued
          /tmp/smoke-venv/bin/python -c "import hued; assert hued.rgb_to_hex(255, 0, 0) == '#FF0000'; print('Smoke test OK:', hued.__version__)"

      - name: Publish distributions and PEP 740 attestations to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

      - name: Generate GitHub SLSA build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Write publish and provenance summary
        env:
          TAG_NAME: ${{ github.ref_name }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG_NAME#v}"
          {
            echo "### Published to PyPI 📦"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`hued\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Tag | \`${TAG_NAME}\` |"
            echo "| Auth | PyPI OIDC Trusted Publishing (blank environment) |"
            echo "| PyPI Provenance | PEP 740 Digital Attestations (\`attestations: true\`) |"
            echo "| SLSA Provenance | ${ATTESTATION_URL} |"
            echo "| All Attestations | https://github.com/${REPO}/attestations |"
            echo "| PyPI URL | https://pypi.org/project/hued/${VERSION}/ |"
          } >> "$GITHUB_STEP_SUMMARY"
